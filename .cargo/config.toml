# Win11-native Rust development stays the default here.
# Use Linux target builds, CI, or remote Linux verification for deployment semantics.
# Do not require or recommend WSL2.
#
# Optional compiler caching:
# Ready-to-enable opt-in snippet:
# [build]
# rustc-wrapper = "sccache"
#
# Keep the repo free of machine-specific wrapper paths, and only enable this
# when `sccache` is already installed and on PATH in the current environment.
#
# SQLx checks stay off the hot path; use `cargo sqlx prepare` locally and
# `cargo sqlx prepare --check` in CI against committed `.sqlx` metadata.
[build]
# Win11 下 rustc / linker / 索引更新并发时更容易撞到文件锁。
# 默认把本地构建并发收成 1，优先稳定；后续若在 CI 或更稳的环境里要提速，可显式覆盖 CARGO_BUILD_JOBS。
jobs = 1

[env]
DATABASE_URL = "postgres://postgres:postgres@127.0.0.1:5432/postgres"
