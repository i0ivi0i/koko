name: 正式发版

on:
  workflow_dispatch:
    inputs:
      version:
        description: 正式版本号（例如 v0.1.1）
        required: true
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: 校验版本号格式
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ inputs.version }}"
          if [[ ! "${VERSION}" =~ ^v[0-9]+(\.[0-9]+){1,2}$ ]]; then
            echo "正式版本号必须长得像 v0.1.1 或 v1.2.3" >&2
            exit 1
          fi

      - name: 检查 tag 是否已存在
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ inputs.version }}"
          if git rev-parse "${VERSION}" >/dev/null 2>&1; then
            echo "版本 tag 已存在：${VERSION}" >&2
            exit 1
          fi

      - name: 创建 GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${{ inputs.version }}"
          gh release create "${VERSION}" \
            --target "${{ github.sha }}" \
            --title "${VERSION}" \
            --generate-notes
