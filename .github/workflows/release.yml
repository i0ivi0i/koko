name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/koko_release
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: koko_release
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d koko_release"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Install Dioxus CLI
        run: curl -sSL https://dioxus.dev/install.sh | bash

      - name: Apply migrations
        run: |
          for migration in migrations/*.sql; do
            PGPASSWORD=postgres psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$migration"
          done

      - name: Build server
        run: cargo build --release -p koko-server

      - name: Build web
        run: dx build --platform web --release --package koko-web

      - name: Build admin
        run: dx build --platform web --release --package koko-admin

      - name: Package release assets
        shell: pwsh
        run: ./package-release.ps1 -Version "${{ github.ref_name }}"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: target/release-artifacts/${{ github.ref_name }}/*.tar.gz
