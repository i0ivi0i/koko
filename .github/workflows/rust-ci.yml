name: Rust CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Verify (${{ matrix.os }} / ${{ matrix.toolchain }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            toolchain: stable
          - os: ubuntu-latest
            toolchain: stable
          - os: windows-latest
            toolchain: beta
          - os: windows-latest
            toolchain: nightly
    steps:
      - uses: actions/checkout@v6

      - name: Configure Rust ${{ matrix.toolchain }}
        shell: pwsh
        run: |
          rustup update ${{ matrix.toolchain }}
          rustup default ${{ matrix.toolchain }}
          rustup target add wasm32-unknown-unknown --toolchain ${{ matrix.toolchain }}

      - name: cargo check
        shell: pwsh
        run: cargo check --locked

      - name: cargo check wasm32
        shell: pwsh
        run: cargo check --locked --target wasm32-unknown-unknown

      - name: cargo test
        shell: pwsh
        run: cargo test --locked

      - name: cargo test --doc
        shell: pwsh
        run: cargo test --locked --doc
