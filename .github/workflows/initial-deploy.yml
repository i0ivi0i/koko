name: Initial Deploy

on:
  workflow_dispatch:
    inputs:
      version:
        description: 首次上线版本号（例如 v0.1.0）
        required: true
        type: string

concurrency:
  group: koko-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  initial-deploy:
    runs-on: ubuntu-latest
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Deployment preflight
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/部署门禁测试.mjs
          node scripts/check-deployment-architecture-fitness.mjs --enforce
          pnpm --dir frontend install --frozen-lockfile
          pnpm --dir frontend build

      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "${VPS_SSH_KEY}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${VPS_HOST}" >> ~/.ssh/known_hosts

      - name: Package release bundle
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ inputs.version }}"
          ARCHIVE="koko-${VERSION}.tar.gz"
          bash ops/package-release.sh "${VERSION}" "${ARCHIVE}"
          echo "ARCHIVE=${ARCHIVE}" >> "${GITHUB_ENV}"
          echo "VERSION=${VERSION}" >> "${GITHUB_ENV}"

      - name: Upload release bundle
        shell: bash
        run: |
          set -euo pipefail
          scp "${ARCHIVE}" "${VPS_USER}@${VPS_HOST}:/tmp/${ARCHIVE}"

      - name: Bootstrap install and first deploy
        shell: bash
        run: |
          set -euo pipefail
          ssh "${VPS_USER}@${VPS_HOST}" "VERSION='${VERSION}' ARCHIVE='${ARCHIVE}' CLOUDFLARE_API_TOKEN='${CLOUDFLARE_API_TOKEN}' bash -s" <<'REMOTE'
          set -euo pipefail

          run_as_root() {
            if [ "$(id -u)" -eq 0 ]; then
              "$@"
            elif command -v sudo >/dev/null 2>&1; then
              sudo "$@"
            else
              echo "当前 VPS 用户既不是 root，也没有 sudo，无法执行正式部署。" >&2
              exit 1
            fi
          }

          upsert_env_value() {
            local key="$1"
            local value="$2"
            local env_file="$3"
            local env_dir
            local tmp_file

            env_dir="$(dirname "${env_file}")"
            tmp_file="$(mktemp)"

            run_as_root mkdir -p "${env_dir}"
            run_as_root touch "${env_file}"
            run_as_root awk -F= -v key="${key}" '$1 != key { print }' "${env_file}" > "${tmp_file}"
            printf '%s=%s\n' "${key}" "${value}" >> "${tmp_file}"
            run_as_root install -m 600 "${tmp_file}" "${env_file}"
            rm -f "${tmp_file}"
          }

          run_as_root mkdir -p /opt/koko/shared/incoming
          run_as_root mv "/tmp/${ARCHIVE}" "/opt/koko/shared/incoming/${VERSION}.tar.gz"
          upsert_env_value "CLOUDFLARE_API_TOKEN" "${CLOUDFLARE_API_TOKEN}" "/opt/koko/env/production.env"

          tmp_dir="/tmp/koko-bootstrap-${VERSION}"
          rm -rf "${tmp_dir}"
          mkdir -p "${tmp_dir}"
          tar -xzf "/opt/koko/shared/incoming/${VERSION}.tar.gz" -C "${tmp_dir}"

          run_as_root bash "${tmp_dir}/ops/install.sh"
          run_as_root bash "${tmp_dir}/ops/deploy.sh" "${VERSION}" "/opt/koko/shared/incoming/${VERSION}.tar.gz"
          run_as_root bash "/opt/koko/current/ops/healthcheck.sh"

          rm -rf "${tmp_dir}"
          REMOTE
