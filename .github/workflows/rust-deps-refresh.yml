name: Rust Dependency Refresh

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"

env:
  CARGO_TERM_COLOR: always
  CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS: allow

jobs:
  refresh-and-verify:
    name: Refresh and Verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Configure stable and nightly Rust
        shell: pwsh
        run: |
          rustup update stable
          rustup default stable
          rustup target add wasm32-unknown-unknown --toolchain stable
          rustup toolchain install nightly --component rust-src
          rustup target add wasm32-unknown-unknown --toolchain nightly

      - name: Install cargo-nextest
        shell: pwsh
        run: cargo install cargo-nextest --locked

      - name: Install sqlx-cli
        shell: pwsh
        run: cargo install sqlx-cli --locked --no-default-features --features native-tls,postgres

      - name: Resolve Dioxus version from lockfile
        id: dioxus
        shell: pwsh
        run: |
          $lockfile = Get-Content Cargo.lock -Raw
          $match = [regex]::Match($lockfile, '(?ms)^\[\[package\]\]\r?\nname = "dioxus"\r?\nversion = "([^"]+)"')
          if (-not $match.Success) {
            throw "Unable to resolve dioxus version from Cargo.lock"
          }
          "version=$($match.Groups[1].Value)" >> $env:GITHUB_OUTPUT

      - name: Install Dioxus CLI
        shell: pwsh
        run: cargo install dioxus-cli --version ${{ steps.dioxus.outputs.version }} --locked

      - name: Refresh lockfile and verify
        shell: pwsh
        run: .\scripts\verify-rust-workspace.ps1 -UpdateDeps

      - name: Capture dependency diff
        id: diff
        shell: pwsh
        run: |
          if (git diff --quiet -- Cargo.toml Cargo.lock) {
            "changed=false" >> $env:GITHUB_OUTPUT
            exit 0
          }

          git diff -- Cargo.toml Cargo.lock > dependency-update.patch
          "changed=true" >> $env:GITHUB_OUTPUT

      - name: Upload dependency diff artifact
        if: steps.diff.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dependency-update-patch
          path: dependency-update.patch
