[package]
name = "koko"
version = "0.1.0"
edition = "2024"
rust-version = "1.94.1"

# Default loop:
# cargo check
# cargo nextest run
# cargo test --doc
# cargo build --timings
#
# SQLx workflow:
# - generate or refresh offline metadata with `cargo sqlx prepare`
# - commit the generated `.sqlx` directory
# - verify metadata freshness in CI with `cargo sqlx prepare --check`

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.debugging]
inherits = "dev"
debug = true

[dependencies]
dioxus = { version = "0.7.4", features = ["web"] }
reqwest = { version = "0.13.2", default-features = false, features = ["json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.18"
uuid = { version = "1.23.0", features = ["v7", "serde"] }
chrono = { version = "0.4.44", features = ["serde"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
axum = "0.8.8"
axum-extra = { version = "0.12.5", features = ["cookie"] }
socketioxide = { version = "0.18.2", features = ["extensions"] }
sqlx = { version = "0.8.6", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "migrate"] }
tokio = { version = "1.50.0", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tower-http = { version = "0.6.8", features = ["cors", "trace", "compression-gzip", "fs"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
uuid = { version = "1.23.0", features = ["v7", "serde", "js"] }
web-sys = { version = "0.3.93", features = ["Window", "Location", "Storage"] }

[dev-dependencies]
futures-util = "0.3.32"
tokio-tungstenite = "0.28.0"
tower = { version = "0.5.3", features = ["util"] }
