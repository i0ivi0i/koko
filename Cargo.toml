[package]
name = "koko"
version = "0.1.0"
edition = "2021"

[dependencies]
dotenvy = "0.15"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tracing = "0.1"
# 日志输出只显式保留当前确实使用的格式化、过滤与 ANSI 终端能力，
# 避免把 tracing-subscriber 的默认特性整包带进来。
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt", "ansi"] }
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "migrate"] }
# 当前 HTTP 冷路径只需要 JSON、查询解析、Tokio runtime 和 HTTP/1 服务能力，
# 不需要 axum 默认附带的表单、额外追踪胶水等默认特性。
axum = { version = "0.8", default-features = false, features = ["json", "query", "tokio", "http1"] }
serde = { version = "1", default-features = false, features = ["derive", "std"] }
serde_json = "1"
uuid = { version = "1", default-features = false, features = ["v4", "std"] }
socketioxide = { version = "0.18.2", features = ["extensions"] }
tower-http = { version = "0.6", features = ["fs"] }

[dev-dependencies]
serial_test = "3"
# 测试里只用到 ServiceExt，不需要 tower 的其它默认特性。
tower = { version = "0.5", default-features = false, features = ["util"] }
