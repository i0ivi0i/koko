[workspace]
members = [".", "koko-torrent-core"]

[package]
name = "koko"
version = "0.1.0"
edition = "2021"
# 禁用自动测试发现：所有集成测试统一走 tests/集成测试.rs 单入口，
# 避免 17 个独立二进制各自链接一遍完整依赖图。
autotests = false

[dependencies]
dotenvy = "0.15"
# 启动入口现在既要接系统退出信号，也要在测试里注入关闭信号并等待优雅停机，
# 同时上传热路径也已经显式依赖 fs/io-util；这里把真实依赖面写明，避免继续偷吃上游 feature 侧带。
tokio = { version = "1", features = ["fs", "io-util", "macros", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
# 日志输出只显式保留当前确实使用的格式化、过滤与 ANSI 终端能力，
# 避免把 tracing-subscriber 的默认特性整包带进来。
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt", "ansi", "time", "local-time"] }
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "migrate"] }
# 当前 HTTP 冷路径只需要 JSON、查询解析、Tokio runtime 和 HTTP/1 服务能力，
# 不需要 axum 默认附带的表单、额外追踪胶水等默认特性。
axum = { version = "0.8", default-features = false, features = ["json", "query", "tokio", "http1", "multipart", "ws", "original-uri"] }
serde = { version = "1", default-features = false, features = ["derive", "std"] }
serde_json = "1"
# 外部可见的公开句柄暂不设计，但内部身份已经需要时间有序 UUID 作为真锚点；
# 这里同时保留 v4，给仍然走兼容短标识的路径做过渡。
uuid = { version = "1", default-features = false, features = ["v4", "v7", "std"] }
# 主题化花名继续站在成熟名字生成轮子肩膀上；
# 项目自己只维护主题词库，不再手搓第二套组合器。
names = { version = "0.14", default-features = false }
socketioxide = { version = "0.18.2", features = ["extensions"] }
tower-http = { version = "0.6", features = ["fs", "set-header"] }
# 对象存储现在同时承担两类职责：
# 1. 本地测试/回滚窗继续用文件系统；
# 2. 新主链需要生成 S3 兼容直传签名。
object_store = { version = "0.13", default-features = false, features = ["aws", "fs"] }
image = "0.25"
infer = "0.19"
kamadak-exif = "0.6"
# 视频元数据提取继续站在纯 Rust 成熟轮子肩膀上，
# 避免为了 MP4/WebM 的宽高探测再手搓一套脆弱解析器。
nom-exif = "2.7"
# `nom-exif` 当前不暴露 MP4 轨道旋转矩阵；这里只用成熟 mp4 轮子补齐展示方向，
# 不接管 MIME 校验、WebM 宽高或视频转码链路。
mp4 = "0.14"
# 大视频 complete 热路径先站在操作系统只读内存映射能力肩膀上，
# 用成熟 crate 把 `fs::read -> Vec<u8>` 的整块拷贝挪掉，而不是手搓第二套文件缓存。
memmap2 = "0.9"
sha2 = "0.10"
hex = "0.4"
bip_metainfo = "0.12"
# swarm join ticket 不应自己手搓 HMAC/JWT；
# 这里直接复用成熟纯 Rust JWT 库，后续 tracker 校验也能共享同一套令牌语义。
jsonwebtoken = { version = "10.3.0", default-features = false, features = ["rust_crypto"] }
# ticket_expires_at 需要稳定 RFC3339 文本，直接复用成熟时间库，避免自己拼日期格式。
time = { version = "0.3.47", features = ["formatting"] }
# 后端现在只需要极薄地向 tusd 发官方 DELETE；
# 这里显式收一层成熟 HTTP client，避免再手搓 transport 删除调用。
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
http-body-util = "0.1"
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
# 标准 HTTP 缓存验证器需要稳定的 IMF-fixdate 解析/格式化；
# 这里直接复用成熟小轮子，避免自己手搓 Last-Modified / If-Modified-Since 细节。
httpdate = "1"
# IP 级限流直接站在成熟令牌桶算法肩膀上，不手搓第二套速率控制器。
governor = "0.8"
# governor 的 axum tower layer 适配，零胶水代码即可接入 HTTP 路由。
tower_governor = "0.8"
# PoW challenge 和 token 的 HMAC 签名/验签，与 sha2 同属 RustCrypto 生态。
hmac = "0.12"
base64 = "0.22"
# 并发安全的 IP → 状态映射表，用于连接计数和自动冷却追踪。
dashmap = "6"

[dev-dependencies]
serial_test = "3"
# 测试里只用到 ServiceExt，不需要 tower 的其它默认特性。
tower = { version = "0.5", default-features = false, features = ["util"] }
# 集成测试验证 koko-torrent-core 与 bip_metainfo 产出一致的 info_hash。
koko-torrent-core = { path = "koko-torrent-core" }

# ── 集成测试统一入口 ─────────────────────────────────────────
# tests/ 下只编译一个二进制，避免 17 次独立链接。
# 参考：https://matklad.github.io/2021/02/27/delete-cargo-integration-tests.html
[[test]]
name = "集成测试"
path = "tests/集成测试.rs"

# ── 编译性能 profile ─────────────────────────────────────────
# 参考：https://doc.rust-lang.org/cargo/guide/build-performance.html

[profile.dev]
# 本项目只保留行号表，够 panic backtrace 用；需要完整调试时用 --profile debugging。
debug = "line-tables-only"

[profile.dev.package."*"]
# 第三方依赖不生成 debug info，节省编译+链接+磁盘。
debug = false

[profile.dev.build-override]
# proc-macro 和 build script 以 opt-level=3 编译：
# serde/sqlx/axum 的 derive 宏展开速度显著提升（宏在编译期执行，优化它 = 加速所有使用方）。
opt-level = 3

[profile.debugging]
# 需要单步调试时：cargo test --profile debugging
inherits = "dev"
debug = true
