[package]
name = "koko"
version = "0.1.0"
edition = "2024"

# Default loop:
# cargo check
# cargo nextest run
# cargo test --doc
# cargo build --timings
#
# SQLx workflow:
# - generate or refresh offline metadata with `cargo sqlx prepare`
# - commit the generated `.sqlx` directory
# - verify metadata freshness in CI with `cargo sqlx prepare --check`

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.debugging]
inherits = "dev"
debug = true

[dependencies]
axum = "0.8"
dioxus = { version = "0.7", features = ["web"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
socketioxide = "0.17"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "migrate"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tower-http = { version = "0.6", features = ["cors", "trace", "compression-gzip", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
uuid = { version = "1", features = ["v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
