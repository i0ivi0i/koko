[package]
name = "koko-server"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.4", features = ["json", "ws"] }
futures-util = "0.3"
headers = "0.4"
koko-contract = { path = "../contract" }
koko-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
socketioxide = { version = "0.18.2", features = ["extensions", "state"] }
sqlx = { version = "0.8.6", features = ["runtime-tokio-native-tls", "postgres", "uuid", "macros", "json", "time"] }
time = "0.3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "net"] }
tower = { version = "0.5.2", features = ["util"] }
tower-http = { version = "0.6.8", features = ["cors", "request-id", "trace", "util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
rust_socketio = "0.6.0"
tokio-tungstenite = "0.28"
