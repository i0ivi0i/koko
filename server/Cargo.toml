[package]
name = "koko-server"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.4", features = ["json"] }
koko-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
sqlx = { version = "0.8.6", features = ["runtime-tokio-native-tls", "postgres", "uuid", "macros", "json", "time"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tower = { version = "0.5.2", features = ["util"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
serde_json = "1"
