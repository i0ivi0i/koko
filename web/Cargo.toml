[package]
name = "koko-web"
version = "0.1.0"
edition = "2024"

[dependencies]
dioxus = { version = "0.7.2", features = ["web"] }
futures-channel = "0.3"
futures-util = "0.3"
gloo-net = "0.6.0"
gloo-storage = "0.3"
gloo-timers = { version = "0.3", features = ["futures"] }
js-sys = "0.3"
koko-contract = { path = "../contract" }
serde_json = "1"

[dev-dependencies]
dioxus-ssr = "0.7.3"
