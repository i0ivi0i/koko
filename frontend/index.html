<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Koko Chat</title>
    <style>
      /* 根页面只负责提供单屏聊天舞台，不能再退回浏览器默认的网页文档流。 */
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0b0f14;
      }

      /* 聊天壳自己管理内部滚动；页面根节点只负责撑满视口。 */
      body > koko-chat-shell {
        display: block;
        width: 100%;
        height: 100%;
        color: #f3f7fb;
      }
    </style>
  </head>
  <body>
    <koko-chat-shell></koko-chat-shell>
    <script type="module" src="/dist/app.js"></script>
  </body>
</html>
