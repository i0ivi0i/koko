<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Koko Chat</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%230b0f14'/%3E%3Cpath d='M18 20h16c7.732 0 14 6.268 14 14s-6.268 14-14 14h-4l-10 8v-8h-2c-1.105 0-2-.895-2-2V22c0-1.105.895-2 2-2z' fill='%23ff6a00'/%3E%3Ccircle cx='27' cy='34' r='3' fill='%23fff8f2'/%3E%3Ccircle cx='35' cy='34' r='3' fill='%23fff8f2'/%3E%3C/svg%3E"
    />
    <style>
      /* 根页面只负责提供单屏聊天舞台，不能再退回浏览器默认的网页文档流。 */
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0b0f14;
      }

      /* 聊天壳自己管理内部滚动；页面根节点只负责撑满视口。 */
      body > koko-chat-shell {
        display: block;
        width: 100%;
        height: 100%;
        color: #f3f7fb;
      }
    </style>
    <link rel="stylesheet" href="{{APP_CSS_PATH}}" />
  </head>
  <body>
    <koko-chat-shell></koko-chat-shell>
    <script type="module" src="{{APP_JS_PATH}}"></script>
  </body>
</html>
